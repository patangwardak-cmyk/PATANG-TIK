name: PATANG TIK Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-build/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-build/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android dependencies
        working-directory: android-build
        run: npm ci

      - name: Sync Capacitor
        working-directory: android-build
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-build/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patang-tik-debug-apk
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
